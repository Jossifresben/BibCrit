<div id="tt-gate" class="tt-gate" data-hash="{{ gate_hash }}">
  <form id="tt-gate-form" class="tt-gate-form" autocomplete="off">
    <label for="tt-gate-pw">{{ _t('tt_gate_prompt') }}</label>
    <input id="tt-gate-pw" type="password" required>
    <button type="submit" class="btn">{{ _t('tt_gate_button') }}</button>
    <p id="tt-gate-msg" class="tt-gate-msg" hidden>{{ _t('tt_gate_wrong') }}</p>
  </form>
</div>
